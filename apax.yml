# General information
name: "@simatic-ax/axftcmlib"
version: 0.0.0-placeholder
author: Siemens AG
# Description will be displayed in the apax extension
description: "Library for Fischertechnik Factory Simulation 24V providing classes for actuators, sensors, axes and time-based encoders"
type: lib
#URL to the repository
repository:
  type: git
  url: https://github.com/simatic-ax/axftcmlib
# Registry information, where the package will be published
registries:
  '@simatic-ax': 'https://npm.pkg.github.com/'
# Environment variables
variables:
  APAX_BUILD_ARGS:
    - '--debug'
targets:
  - '1500'
  - 'llvm'

# Install Setting
apaxVersion: 3.5.0
installStrategy: strict

# Catalogs
catalogs:
  "@ax/simatic-ax": ^2504.0.0

publicKeys:
  "@simatic-ax":
    "v1": "3792a7e926775425ccdd29ceed8c368c3008b5b33d7d5550b3cb1f58093e1dff"
    "v2": "7af3e394eb2b285a3d99ab8e1f745cc6db75704b30a80393339c721a92ffffd9"

# Dependencies
devDependencies:
  '@ax/sdk': ^2504.0.0
  "@simatic-ax/snippetscollection": ^1.0.0

dependencies:
  "@ax/simatic-1500-clocks": ^10.0.6
  "@ax/system-timer": ^10.0.24
  "@simatic-ax/simple-control-modules": ^8.0.0
  "@simatic-ax/io": ^9.0.0
  "@simatic-ax/commands": ^3.0.0
  "@simatic-ax/statemachine": ^8.0.0

  # Files, which will be shipped with the library
files:
  - 'README.md'
  - 'LICENSE.md'
  - 'doc'
  - 'bin'
  - 'snippets'
