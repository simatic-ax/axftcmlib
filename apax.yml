# General information
name: "@simatic-ax/axftcmlib"
version: 0.0.0-placeholder
author: Siemens AG
# Description will be displayed in the apax extension
description: Basic control modules for fabric simulation for AX training purposes
type: lib
#URL to the repository
repository:
  type: git
  url: https://github.com/simatic-ax/axftcmlib
# Registry information, where the package will be published
registries:
  '@simatic-ax': 'https://npm.pkg.github.com/'
# Environment variables
variables:
  APAX_BUILD_ARGS:
    - '--debug'
targets:
  - '1500'
  - 'llvm'
  
# Install Setting
apaxVersion: 3.2.1
installStrategy: strict

# Dependencies
devDependencies:
  '@ax/sdk': 2411.1.0
  "@simatic-ax/snippetscollection": 1.0.0

dependencies:
  "@ax/simatic-1500-clocks": 8.0.8
  "@ax/system-timer": 8.0.8
  "@simatic-ax/simple-control-modules": 7.0.0
  "@simatic-ax/io": 7.1.0
  "@simatic-ax/commands": 1.0.0
  "@simatic-ax/statemachine": 7.0.0
  "@simatic-ax/types": ^1.0.0

# Files, which will be shipped with the library
files:
  - 'README.md'
  - 'LICENSE.md'
  - 'doc'
  - 'src'
  - 'snippets'
